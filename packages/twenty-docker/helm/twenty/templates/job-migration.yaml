{{- /*
OMNIA-CUSTOM: owns schema upgrades (server pods set DISABLE_DB_MIGRATIONS). Only upgrade, never the forced
instance-commands runner: it records fast commands per workspace, so upgrade then skips every slow and workspace command.
Env mirrors deployment-server.yaml, storage env included (upgrade commands use file storage).
Pre-upgrade only: a first install (new cluster, DR, staging) needs the one-off upgrade pod before helm install.
With clickhouse.migration.secretName set it then applies ClickHouse (event log) migrations as the migrator user,
time-boxed and warn-only: event logs are optional, so ClickHouse must never fail or stall a CRM deploy.
*/}}
{{- if .Values.server.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "twenty.fullname" . }}-migration-{{ .Release.Revision }}
  namespace: {{ include "twenty.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "twenty.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "twenty.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: {{ include "twenty.serviceAccountName" . }}
      securityContext:
{{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ if .Values.db.enabled }}{{ include "twenty.fullname" . }}-db{{ else }}{{ .Values.db.external.host }}{{ end }} \
                               -p {{ if .Values.db.enabled }}5432{{ else }}{{ .Values.db.external.port | default 5432 }}{{ end }} \
                               -U postgres; do
                echo "Waiting for database socket..."
                sleep 2
              done
              echo "Database socket is ready!"
      containers:
        - name: upgrade
          {{- $img := include "twenty.server.image" . }}
          image: {{ include "twenty.image.repository" $img }}:{{ include "twenty.image.tag" $img }}
          imagePullPolicy: {{ include "twenty.image.pullPolicy" $img }}
          command:
            - sh
            - -c
            - >-
              node dist/command/command.js omnia:run-legacy-typeorm-migrations &&
              node dist/command/command.js cache:flush &&
              node dist/command/command.js upgrade &&
              node dist/command/command.js cache:flush
              {{- if .Values.clickhouse.migration.secretName }} &&
              { [ -z "${CLICKHOUSE_MIGRATION_URL:-}" ] ||
              CLICKHOUSE_URL="$CLICKHOUSE_MIGRATION_URL" timeout 900 node dist/database/clickhouse/migrations/run-migrations.js ||
              echo "WARNING: ClickHouse migrations failed; event logs may drop events until they are re-run"; }
              {{- end }}
          env:
            - name: SERVER_URL
              value: {{ include "twenty.serverUrl" . | quote }}
            {{- if eq (include "twenty.db.useExternalSecret" .) "true" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twenty.dbPassword.secretName" . }}
                  key: {{ include "twenty.dbPassword.secretKey" . }}
            - name: PG_DATABASE_URL
              value: {{ include "twenty.dbUrl.template" . | quote }}
            {{- else }}
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "twenty.dbUrl.secretName" . }}
                  key: url
            {{- end }}
            {{- if eq (include "twenty.redis.useExternalSecret" .) "true" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.secretName }}
                  key: {{ .Values.redis.external.passwordKey }}
            {{- else if .Values.redis.external.password }}
            - name: REDIS_PASSWORD
              value: {{ .Values.redis.external.password | quote }}
            {{- end }}
            - name: REDIS_URL
              value: {{ include "twenty.redisUrl" . | quote }}
            - name: SIGN_IN_PREFILLED
              value: {{ .Values.server.env.SIGN_IN_PREFILLED | quote }}
            - name: STORAGE_TYPE
              value: {{ include "twenty.storageType" . | quote }}
            - name: ACCESS_TOKEN_EXPIRES_IN
              value: {{ .Values.server.env.ACCESS_TOKEN_EXPIRES_IN | quote }}
            - name: LOGIN_TOKEN_EXPIRES_IN
              value: {{ .Values.server.env.LOGIN_TOKEN_EXPIRES_IN | quote }}
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "twenty.secret.tokens.name" . }}
                  key: accessToken
            {{- $storageEnv := (include "twenty.storageEnv" .) }}
            {{- if $storageEnv }}
            {{- $storageEnv | nindent 12 }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.clickhouse.migration }}
            {{- if .secretName }}
            - name: CLICKHOUSE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .urlKey | quote }}
                  optional: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
{{- end }}
