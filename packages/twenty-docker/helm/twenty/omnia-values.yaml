serviceAccount:
  create: false
  # OMNIA-CUSTOM: Pod Identity Association maps this SA to the runtime IAM role
  # for Bedrock, Amazon Translate, and S3 QA artifacts under AWS BAA (HIPAA).
  name: twenty-bedrock

server:
  replicaCount: 2
  # OMNIA-CUSTOM: the chart sets 7d; a user access JWT is a bearer credential no sign-out revokes.
  env:
    ACCESS_TOKEN_EXPIRES_IN: "30m"
  persistence:
    enabled: false
  dockerDataPersistence:
    enabled: false
  image:
    repository: 189365142140.dkr.ecr.us-east-1.amazonaws.com/twenty-crm
    tag: latest
  # OMNIA-CUSTOM: zero-downtime rollouts; pdb-server.yaml keeps a pod up through drains.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 15
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: twenty
          app.kubernetes.io/component: server
  nodeSelector:
    environment: production
  tolerations: &productionTolerations
    - key: environment
      operator: Equal
      value: production
      effect: NoSchedule
  # OMNIA-CUSTOM: 10-minute startup window and faster liveness/readiness than upstream.
  startupProbe:
    initialDelaySeconds: 10
    failureThreshold: 60
  livenessProbe:
    periodSeconds: 10
  readinessProbe:
    periodSeconds: 5
  # Shared by the worker and the migration job.
  extraEnv: &omniaExtraEnv
    # OMNIA-CUSTOM: job-migration.yaml runs upgrades; cron registration stays on the server.
    - name: DISABLE_DB_MIGRATIONS
      value: "true"
    # OMNIA-CUSTOM: V8's default old space is about half the pod limit; exports and
    # imports need the headroom (2026-08-22 worker OOM).
    - name: NODE_OPTIONS
      value: "--max-old-space-size=1536"
    - name: LOGIC_FUNCTION_TYPE
      value: LOCAL
    # OMNIA-CUSTOM: logic functions call the server in-cluster, not through the ingress.
    - name: SERVER_INTERNAL_URL
      value: "http://my-twenty-twenty-server.twentycrm.svc.cluster.local:3000"
    # OMNIA-CUSTOM: applicationRegistration ids whose logic functions get the Pod Identity
    # credentials (comma-separated). Empty grants none.
    - name: LOGIC_FUNCTION_AWS_CONTAINER_CREDENTIALS_APP_REGISTRATION_IDS
      value: ""
    - name: CONVOSO_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: convoso-credentials
          key: apiToken
    # OMNIA-CUSTOM: limits sized for Omnia scripts and the omniaagent.com webhooks.
    # Webhook calls above the limit are dropped, not queued.
    - name: API_RATE_LIMITING_SHORT_LIMIT
      value: "500"
    - name: API_RATE_LIMITING_LONG_LIMIT
      value: "5000"
    - name: APPLICATION_API_RATE_LIMITING_LIMIT
      value: "5000"
    - name: APPLICATION_JOB_ENQUEUE_RATE_LIMITING_LIMIT
      value: "5000"
    - name: WEBHOOK_CALL_RATE_LIMITING_LIMIT
      value: "600"
    # OMNIA-CUSTOM: every AI tier resolves to the BAA-covered Bedrock catalog entry.
    - name: AI_MODELS_DEFAULT_EXTRA_FAST
      value: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
    - name: AI_MODELS_DEFAULT_FAST
      value: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
    - name: AI_MODELS_DEFAULT_BALANCED
      value: "bedrock/us.anthropic.claude-sonnet-4-6"
    - name: AI_MODELS_DEFAULT_SMART
      value: "bedrock/us.anthropic.claude-sonnet-4-6"
    - name: AI_MODELS_DEFAULT_EXTRA_SMART
      value: "bedrock/us.anthropic.claude-opus-4-7"
    # OMNIA-CUSTOM: upstream telemetry sends sign-up names and emails to twenty-telemetry.com.
    - name: TELEMETRY_ENABLED
      value: "false"
    # OMNIA-CUSTOM: sessions are httpOnly cookies, yet every sign-in still returns a refresh token to page
    # JavaScript that sign-out never revokes; renewToken would trade it for new sessions for 60 days.
    - name: REFRESH_TOKEN_EXPIRES_IN
      value: "5m"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2560Mi
  ingress:
    enabled: true
    className: nginx
    acme: false
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
      nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "10"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - host: crm.omniaagent.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: twenty-tls
        hosts:
          - crm.omniaagent.com

worker:
  replicaCount: 2
  image:
    repository: 189365142140.dkr.ecr.us-east-1.amazonaws.com/twenty-crm
    tag: latest
  # OMNIA-CUSTOM: one worker generation at a time, so two versions never consume the queues.
  strategy:
    type: Recreate
  tolerations: *productionTolerations
  extraEnv: *omniaExtraEnv
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2048Mi

db:
  enabled: false
  external:
    host: twenty-crm-db.cluster-cgx4wwy00vhj.us-east-1.rds.amazonaws.com
    port: 5432
    user: twenty_app_user
    database: twenty
    ssl: false
    secretName: twenty-rds-credentials
    passwordKey: password

storage:
  type: s3
  s3:
    bucket: twenty-crm-storage-189365142140
    region: us-east-1
    secretName: twenty-s3-credentials
    accessKeyIdKey: accessKeyId
    secretAccessKeyKey: secretAccessKey

redisInternal:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  tolerations: *productionTolerations

# Only the in-cluster Postgres reads the root key (db.enabled is false in prod).
tolerations: *productionTolerations
